name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm i -g vercel
          vercel pull --yes --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN \
            -e ADMIN_EMAILS="${{ secrets.ADMIN_EMAILS }}" \
            -e STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            -e STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            -e MAILTRAP_API_TOKEN="${{ secrets.MAILTRAP_API_TOKEN }}" \
            -e CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -e CLOUDFLARE_ZONE_ID_AEROSYS="${{ secrets.CLOUDFLARE_ZONE_ID_AEROSYS }}" \
            -e CLOUDFLARE_ZONE_ID_MACROSOFT="${{ secrets.CLOUDFLARE_ZONE_ID_MACROSOFT }}" \
            -e CLOUD_DATABASE_URL="${{ secrets.CLOUD_DATABASE_URL }}"
