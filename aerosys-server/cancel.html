<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Checkout Cancelled — AeroSys</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--void:#040608;--panel:#0A1018;--dim:#5A7898;--head:#D0E8FA;--amber:#F5A623;--line:#162030;--mono:'IBM Plex Mono',monospace;--display:'Orbitron',var(--mono);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--void);color:var(--head);font-family:var(--mono);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
.card{background:var(--panel);border:1px solid var(--line);padding:3rem;max-width:480px;width:100%;text-align:center;}
.icon{font-size:3rem;margin-bottom:1.5rem;}
h1{font-family:var(--display);font-size:1.4rem;font-weight:800;color:var(--head);letter-spacing:.06em;margin-bottom:.75rem;}
p{font-size:.85rem;color:var(--dim);line-height:1.8;margin-bottom:1.5rem;}
.links{display:flex;flex-direction:column;gap:.6rem;}
.links a{display:block;font-family:var(--display);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--amber);border:1px solid rgba(245,166,35,.3);padding:11px;text-decoration:none;}
.links a:hover{background:rgba(245,166,35,.08);}
</style>
</head>
<body>
<div class="card">
  <div class="icon">✕</div>
  <h1>Checkout Cancelled</h1>
  <p>No charge was made. You can return to the platform and try again whenever you're ready.</p>
  <div class="links">
    <a href="/aerosys9000/">← Return to AeroSys 9000</a>
    <a href="/mission-control/">← Return to Mission Control</a>
    <a href="/rtos/">← Return to RTOS</a>
    <a href="/">← Suite Home</a>
  </div>
</div>
</body>
</html>
